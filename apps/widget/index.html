<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Assistant Widget - Dev</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: url('/bg.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 0;
    }

    .demo-container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 0 0 24px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
    }

    .info-box {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    .info-box strong {
      color: #5eead4;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div class="demo-container">
    <h1>Silver Waves Resort & Spa Daman</h1>
    <p>Experience the future of guest hospitality with our premium AI-driven booking assistant.</p>
    <div class="info-box">
      <strong>Live Preview:</strong> The luxury widget is available in the bottom-right corner.
    </div>
  </div>

  <!-- Widget mount point -->
  <div id="hotel-assistant-widget"></div>

  <script type="module" src="/src/main.tsx" data-hotel-id="edcad4e5-5f88-4fba-8b74-26f91cd6dbc1"
    data-api-url="http://localhost:3001/api/v1"></script>
</body>

</html>
