version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hotel-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_password}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_assistant}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hotel_user} -d ${POSTGRES_DB:-hotel_assistant}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hotel-assistant-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MailHog for email testing (development only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hotel-assistant-mail
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    profiles:
      - dev

  # Python Scraper Microservice (Crawl4AI + Gemini)
  scraper:
    build: ./apps/scraper
    container_name: hotel-assistant-scraper
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}
      - NESTJS_API_URL=http://api:3001
      - SCRAPER_PORT=3003
      - MAX_CRAWL_PAGES=${MAX_CRAWL_PAGES:-50}
      - CRON_ENABLED=${CRON_ENABLED:-false}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 2 * * 0}
    healthcheck:
      test: [ 'CMD', 'python', '-c', 'import httpx; httpx.get("http://localhost:3003/health")' ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: hotel-assistant-network
