[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g pnpm@9",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @hotel-assistant/shared build",
  "cd apps/api && npx prisma generate",
  "pnpm --filter @hotel-assistant/api build"
]

[start]
cmd = "node apps/api/dist/main.js"
